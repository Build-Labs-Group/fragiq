# O bot mantém conexão TCP persistente com a Steam: nada de auto_stop, nada de
# porta exposta. É uma máquina só, sempre ligada, fazendo só conexões de saída.
app = "fragiq-bot"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  BOT_GRACE_MS = "90000"
  BOT_AUTO_ACCEPT = "true"
  FRAGIQ_WEBHOOK_URL = "https://fragiq.buildlabs.com.br/api/sync/steam-event"

# Sem [http_service]: não há o que servir. Só o processo do steam-user.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# O processo sai com código 1 em erro de conexão (index.ts) e conta com o host
# para voltar. Sem isto, a máquina ficaria parada depois da primeira queda.
[[restart]]
  policy = "always"
