# Publica o site na conta da Build Labs: push na main (ou execução manual)
# vira a pilha Fragiq-Prod (Lambda + HTTP API). Sem prévia por PR: o site lê
# o banco de produção. O cdk.json de infra/ monta o pacote do site
# (scripts/aws/construir.mjs) antes de sintetizar. Plano e volta:
# docs/migracao-site-build-labs.md.
#
# Este repositório é público, e o GitHub não deixa repositório público usar o
# publicar.yml da infra-compartilhada (privada). Por isso este arquivo é a
# cópia de infra-compartilhada/modelos/publicar-repositorio-publico.yml: o
# corretor aceita exatamente este arquivo, nesta branch, só para este
# repositório. Mudou o modelo lá? Copie de novo para cá.
#
# Publicação de um repositório PÚBLICO da org pela esteira da Build Labs.
#
# O GitHub não deixa um repositório público usar workflow nem ação de um
# repositório privado, e a infra-compartilhada é privada. Este arquivo faz o
# mesmo que o publicar.yml dela, sem depender dela: troca o token OIDC do job
# por uma credencial de 1 h no corretor e roda o CDK com ambiente=prod.
#
# Como usar:
#   1. Na infra-compartilhada: npm run registrar -- <repo> --publicacao-propria
#      (sem prévia), commit, PR e merge. O deploy da base ensina o corretor.
#   2. Copie este arquivo para .github/workflows/publicar.yml do repositório.
#      O nome e a branch são exatos: o corretor só aceita
#      Build-Labs-Group/<repo>/.github/workflows/publicar.yml@refs/heads/main,
#      rodando como workflow principal (não por workflow_call).
#   3. Ajuste DIRETORIO (pasta do app CDK) e NODE, se precisar.
#
# Só produção: push e execução manual na main. Qualquer outro evento ou
# branch o corretor nega, e repositório com publicação própria não tem prévia.
#
# O log deste job é público. As dependências se instalam antes da credencial
# (script de instalação de pacote não vê a chave), a credencial é mascarada
# antes de ir para o ambiente, e nenhum passo imprime segredo.
name: publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  URL_CORRETOR: https://paocfivyspn4qynpqp4j5ilauq0gedwh.lambda-url.us-east-2.on.aws/ # saída UrlDoCorretor da pilha InfraCompartilhada-Prod
  DIRETORIO: infra
  NODE: "22"
  REGIAO: us-east-2

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: publicar-${{ github.repository }}-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE }}
      - name: Dependências (antes da credencial)
        run: |
          if [ -f package-lock.json ] && [ "$DIRETORIO" != "." ]; then npm ci --no-audit --no-fund; fi
          (cd "$DIRETORIO" && npm ci --no-audit --no-fund)
      - name: Credencial AWS pelo corretor
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::O job precisa de 'permissions: id-token: write'."
            exit 1
          fi
          token=$(curl -sfS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=buildlabs-credenciais-aws" | jq -r .value)
          echo "::add-mask::$token"
          resposta=$(mktemp)
          codigo=$(curl -sS -o "$resposta" -w '%{http_code}' -X POST -H "Authorization: Bearer $token" "$URL_CORRETOR")
          if [ "$codigo" != "200" ]; then
            echo "::error::Corretor recusou ($codigo): $(jq -r '.erro // "sem motivo"' "$resposta")"
            rm -f "$resposta"
            exit 1
          fi
          for campo in AccessKeyId SecretAccessKey SessionToken; do
            echo "::add-mask::$(jq -r ".$campo" "$resposta")"
          done
          {
            echo "AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId "$resposta")"
            echo "AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey "$resposta")"
            echo "AWS_SESSION_TOKEN=$(jq -r .SessionToken "$resposta")"
            echo "AWS_REGION=$REGIAO"
            echo "AWS_DEFAULT_REGION=$REGIAO"
          } >> "$GITHUB_ENV"
          echo "Credencial de $(jq -r .projeto "$resposta") ($(jq -r .modo "$resposta")), vale até $(jq -r .Expiration "$resposta")."
          rm -f "$resposta"
      - name: Deploy
        working-directory: ${{ env.DIRETORIO }}
        run: npx cdk deploy --all --require-approval never --concurrency 4 --context ambiente=prod
